<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK — Portal</title>
    <meta name="description" content="Assignment & Portfolio Keeper — Upload portal for educational institutions.">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235D7450'/%3E%3Ctext x='16' y='22' font-size='16' font-weight='700' text-anchor='middle' fill='%23fff' font-family='system-ui'%3EA%3C/text%3E%3C/svg%3E">
</head>
<body class="auth-page">
    <div class="toast-container" id="toastContainer"></div>
    <button class="theme-toggle auth-theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <span id="themeIcon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
    </button>

    <div class="auth-center">
        <!-- Login Form -->
        <div id="loginForm">
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Login to your account to continue</p>

            <div class="auth-form">
                <div class="form-group">
                    <label class="form-label" for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" class="form-input" placeholder="your username" autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" autocomplete="current-password">
                </div>
                <button class="btn btn-primary btn-full" onclick="login()" id="loginButton">Login</button>
            </div>
            <p class="auth-switch">Don't have an account? <a href="#" onclick="showRegister(); return false;">Create one</a></p>
        </div>

        <!-- Register Form -->
        <div id="registerForm" style="display:none;">
            <h2 class="auth-title">Create Account</h2>
            <p class="auth-subtitle">Join the portal to get started</p>

            <div class="auth-form">
                <div class="role-toggle">
                    <button class="role-toggle-btn active" id="roleStudent" onclick="selectRole('student')">Student</button>
                    <button class="role-toggle-btn" id="roleTeacher" onclick="selectRole('teacher')">Teacher</button>
                </div>

                <div class="form-group">
                    <label class="form-label" for="registerName">Name</label>
                    <input type="text" id="registerName" class="form-input" placeholder="Your name">
                </div>
                <div class="form-group">
                    <label class="form-label" for="registerUsername">Username</label>
                    <input type="text" id="registerUsername" class="form-input" placeholder="Choose a username" autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label" for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" class="form-input" placeholder="••••••••" autocomplete="new-password">
                </div>
                <input type="hidden" id="registerRole" value="student">

                <div id="teacherCodeDiv" class="form-group" style="display:none;">
                    <label class="form-label" for="teacherCode">Teacher Code</label>
                    <input type="password" id="teacherCode" class="form-input" placeholder="Enter teacher code">
                    <span class="form-helper">You need a valid teacher code to register as a teacher</span>
                </div>

                <button class="btn btn-primary btn-full" onclick="register()" id="registerButton">Create Account</button>
            </div>
            <p class="auth-switch">Already have an account? <a href="#" onclick="showLogin(); return false;">Login here</a></p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
    <script>
        function selectRole(role) {
            document.getElementById('registerRole').value = role;
            document.getElementById('roleStudent').classList.toggle('active', role === 'student');
            document.getElementById('roleTeacher').classList.toggle('active', role === 'teacher');
            document.getElementById('teacherCodeDiv').style.display = role === 'teacher' ? 'block' : 'none';
        }
        // Wire up theme toggle on auth page
        document.addEventListener('DOMContentLoaded', function() {
            initTheme();
            var btn = document.getElementById('themeToggle');
            if (btn) btn.onclick = function(e) { doThemeToggle(e); };
        });
    </script>
</body>
</html>
